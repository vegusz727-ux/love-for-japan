
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For You ❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 background:#fff4f9;font-family:Arial,sans-serif;color:#70415c
}
.card{
 width:92%;max-width:350px;padding:24px 18px;text-align:center;
 background:white;border-radius:25px;
 box-shadow:0 8px 30px #e8bfd4
}
h1{font-family:Georgia,serif;font-style:italic}
.dial{
 width:250px;height:250px;margin:25px auto;position:relative;
 border-radius:50%;background:#eabbd3;border:9px solid #d58caf;
 box-shadow:inset 0 0 15px #c987a9
}
.center{
 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:62px;height:62px;border-radius:50%;background:#dca1c0;
 display:grid;place-items:center;font-size:28px
}
.key{
 position:absolute;width:36px;height:36px;border:0;border-radius:50%;
 background:#532d49;color:white;font-size:15px
}
.key:active{background:#d46ca1}
.display{
 padding:12px;margin:10px 0;background:#fff0f7;
 border-radius:12px;font-size:22px;letter-spacing:6px
}
button.action{
 border:0;border-radius:20px;padding:12px 18px;
 background:#d88eb5;color:white;margin:5px;font-size:15px
}
#letter{
 display:none;margin-top:15px;padding:16px;border-radius:15px;
 background:#fff0f7;line-height:1.9;white-space:pre-line
}
small{color:#aa7d97}
</style>
</head>
<body>
<main class="card">
<h1>☎ For You ❤️</h1>
<p>ของขวัญสำหรับคนพิเศษ</p>
<div class="dial" id="dial">
<div class="center">♡</div>
</div>
<div class="display" id="display">_ _ _ _</div>
<button class="action" onclick="checkCode()">เปิดหัวใจ 💗</button>
<button class="action" onclick="clearCode()">ล้าง</button>
<p><small>คำใบ้: วันที่พิเศษของเรา 💌</small></p>

<div id="letter">💗 ถึงเจแปนคนเก่งของเค้า

เค้ารักเจแปนนะ รักมากๆ
เค้าไม่ชอบเวลาเราทะเลาะกันเลย
เค้ารู้สึกว่าจะเสียเธอไปทุกครั้ง
เค้าอยากโตไปพร้อมกับเธอมากๆ
เค้ารักที่สุด ❤️

รักเธอที่สุดเลยนะ
จากกัส 💌</div>
</main>

<script>
let code="";
const dial=document.getElementById("dial");
const display=document.getElementById("display");
const letter=document.getElementById("letter");

for(let i=0;i<10;i++){
 const angle=(i*36-90)*Math.PI/180;
 const b=document.createElement("button");
 b.className="key";
 b.textContent=i;
 b.style.left=(107+85*Math.cos(angle)-18)+"px";
 b.style.top=(107+85*Math.sin(angle)-18)+"px";
 b.onclick=()=>{
  if(code.length<4)code+=i;
  display.textContent=code.padEnd(4,"_").split("").join(" ");
 };
 dial.appendChild(b);
}

function clearCode(){
 code="";
 display.textContent="_ _ _ _";
 letter.style.display="none";
}

function checkCode(){
 if(code==="2009"){
  letter.style.display="block";
 }else{
  alert("รหัสยังไม่ถูกนะ ลองใหม่อีกครั้ง 💗");
  clearCode();
 }
}
</script>
</body>
</html>
